[riscv/mbv]
BUILD_TESTS = True
COMPILER = clang
WARNING_FLAGS = -Wall -Wextra
ABI_FLAGS = -ftls-model=local-exec -march=rv32imafc_zicsr_zifencei -mabi=ilp32f --sysroot=${HOME}/rtems/7/riscv-rtems7 -idirafter ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include -rtlib=compiler-rt -nostartfiles -L${HOME}/rtems/7/riscv-rtems7/lib/rv32imafc/ilp32f -L${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f -L${WORK}/ehlib
CXX_WARNING_FLAGS = -stdlib=libstdc++ -isystem ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include/c++ -isystem ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include/c++/riscv-rtems7/rv32imafc/ilp32f -isystem ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include/c++/backward
LINKFLAGS = ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crti.o ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crtbegin.o
LDFLAGS = -lgcc_eh -stdlib=libstdc++ -Wl,--gc-sections -fuse-ld=lld -T linkcmds ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crtend.o ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crtn.o

[riscv/mbv]
MBV_FDT_PROBE_ADDRESS = 0x00010000
BUILD_TESTS = True
COMPILER = clang
WARNING_FLAGS = -Wall -Wextra
ABI_FLAGS = -march=rv32imafc_zicsr_zifencei -mabi=ilp32f --sysroot=<toolchain>/riscv-rtems7 --gcc-install-dir=<toolchain>/lib/gcc/riscv-rtems7/15.2.0 -rtlib=compiler-rt -L<toolchain>/riscv-rtems7/lib/rv32imafc/ilp32f -L<toolchain>/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f -L<scratch>/ehlib
LDFLAGS = -lgcc_eh -Wl,--gc-sections -fuse-ld=lld

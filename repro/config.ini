[riscv/mbv]
MBV_FDT_PROBE_ADDRESS = 0x00010000
BUILD_TESTS = True
COMPILER = clang
WARNING_FLAGS = -Wall -Wextra
ABI_FLAGS = -march=rv32imafc_zicsr_zifencei -mabi=ilp32f --sysroot=<toolchain>/riscv-rtems7 -idirafter <toolchain>/lib/gcc/riscv-rtems7/15.2.0/include -rtlib=compiler-rt -L<scratch>/ehlib -nostartfiles -L<toolchain>/riscv-rtems7/lib/rv32imafc/ilp32f -L<toolchain>/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f
CXX_WARNING_FLAGS = -stdlib=libstdc++ -isystem <toolchain>/lib/gcc/riscv-rtems7/15.2.0/include/c++ -isystem <toolchain>/lib/gcc/riscv-rtems7/15.2.0/include/c++/riscv-rtems7/rv32imafc/ilp32f -isystem <toolchain>/lib/gcc/riscv-rtems7/15.2.0/include/c++/backward
LINKFLAGS = <toolchain>/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crti.o <toolchain>/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crtbegin.o
LDFLAGS = -lgcc_eh -stdlib=libstdc++ -Wl,--gc-sections -fuse-ld=lld -T linkcmds <toolchain>/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crtend.o <toolchain>/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f/crtn.o

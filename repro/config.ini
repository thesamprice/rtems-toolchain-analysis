[riscv/mbv]
BUILD_TESTS = True
COMPILER = clang
WARNING_FLAGS = -Wall -Wextra
CC_WARNING_FLAGS = -Wmissing-prototypes -Wimplicit-function-declaration -Wstrict-prototypes -Wnested-externs
ABI_FLAGS = -march=rv32imafc_zicsr_zifencei -mabi=ilp32f --sysroot=${HOME}/rtems/7/riscv-rtems7 -idirafter ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include -rtlib=libgcc -nostartfiles -L${HOME}/rtems/7/riscv-rtems7/lib/rv32imafc/ilp32f -L${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/rv32imafc/ilp32f
CXX_WARNING_FLAGS = -stdlib=libstdc++ -isystem ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include/c++ -isystem ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include/c++/riscv-rtems7/rv32imafc/ilp32f -isystem ${HOME}/rtems/7/lib/gcc/riscv-rtems7/15.2.0/include/c++/backward
LDFLAGS = -Wl,--gc-sections -fuse-ld=lld
